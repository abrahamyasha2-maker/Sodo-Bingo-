<style>

html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Ethiopic",system-ui,sans-serif;line-height:1.25}
main{max-width:480px;height:100vh;margin:0 auto;padding:5px;display:flex;flex-direction:column;box-sizing:border-box}
[hidden]{display:none!important}

.wallet-box{background:var(--card);border-radius:10px;padding:5px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;flex-shrink:0}

.live-5-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:5px;flex-shrink:0}
.stat-box-5{background:#0f2926;border:1px solid rgba(45,212,191,0.25);border-radius:10px;padding:4px 2px;text-align:center}

.main-layout{display:grid;grid-template-columns:132px 1fr;gap:6px;align-items:stretch;flex-grow:1;min-height:0;overflow:hidden;height:100%}

.mb-col{display:grid;grid-template-rows:20px repeat(15,1fr);gap:1.5px;height:100%;min-height:0}
.mb-header{font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:1;aspect-ratio:1;max-height:20px;margin:0 auto;width:20px;background:rgba(255,255,255,0.06)}

#number-selection-container{flex-grow:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

.input-field{width:100%;padding:8px;border-radius:6px;border:1px solid var(--cell);background:var(--bg);color:var(--ink);margin-bottom:8px;box-sizing:border-box;font-size:13px;font-family:inherit}

<script>
const $=q=>document.querySelector(q),NC=600,MAX=4,STK=10;
const TWELVE_HOURS_MS = 12 * 60 * 60 * 1000;
let uid="",tgName="",tgUsername="",tgId="",balance=0,selectedCards=[];
let pendingDeposits = [];
let pendingWithdraws = [];
let winnerHistory = [];
let adminTab = 'dep';
let currentDepositAmt = 0;
let gameInterval = null;
let countdownInterval = null;
let drawnBalls = [];
let isGameRunning = false;
let isCountingDown = false;
let timeLeft = 30;
let winningIndicesPerCard = {};
let winningLineTypeDesc = {};
let winningBallNum = null;
let gameLayoutInitialized = false;
let currentGameCode = "";
let bonusAmount = 1000;
let audioCtx = null;
let soundEnabled = true;

const R=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

// የ 12 ሰዓት የአሸናፊዎች መዝገብ አስተዳደር
function loadWinnerHistory() {
  try {
    const raw = localStorage.getItem('sodo_winner_history_12h');
    if (!raw) {
      winnerHistory = [];
      saveWinnerHistory(Date.now());
      return;
    }
    const parsed = JSON.parse(raw);
    const cycleStart = Number(parsed.cycleStart) || Date.now();
    const now = Date.now();
    if (now - cycleStart >= TWELVE_HOURS_MS) {
      winnerHistory = [];
      saveWinnerHistory(now);
    } else {
      winnerHistory = Array.isArray(parsed.items) ? parsed.items : [];
    }
  } catch (_) {
    winnerHistory = [];
  }
}

function saveWinnerHistory(cycleStartOverride) {
  try {
    let existingStart = Date.now();
    const raw = localStorage.getItem('sodo_winner_history_12h');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.cycleStart) existingStart = Number(parsed.cycleStart);
    }
    const cycleStart = cycleStartOverride || existingStart;
    localStorage.setItem('sodo_winner_history_12h', JSON.stringify({
      cycleStart: cycleStart,
      items: winnerHistory
    }));
  } catch (_) {}
}

function checkAndReset12HourWinners() {
  try {
    const raw = localStorage.getItem('sodo_winner_history_12h');
    if (!raw) return;
    const parsed = JSON.parse(raw);
    const cycleStart = Number(parsed.cycleStart) || Date.now();
    if (Date.now() - cycleStart >= TWELVE_HOURS_MS) {
      winnerHistory = [];
      saveWinnerHistory(Date.now());
      if ($('#admin-modal') && !$('#admin-modal').hidden && adminTab === 'winners') {
        renderAdminRequests();
      }
    }
  } catch (_) {}
}

function recordWinnerEntry(winnerHandle, cardId, amountWon, gameCode) {
  checkAndReset12HourWinners();
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  winnerHistory.unshift({
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    winner: winnerHandle,
    cardId: cardId,
    amount: Number(amountWon).toFixed(2),
    gameCode: gameCode || '–',
    time: timeStr,
    timestamp: Date.now()
  });
  saveWinnerHistory();
}

function ensureAudioContext() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!audioCtx) {
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  } catch (_) {
    return null;
  }
}

function syncSoundButtonUI() {
  const btn = $('#sound-toggle-btn');
  if (!btn) return;
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.title = soundEnabled ? 'ድምፅ አጥፋ' : 'ድምፅ አብራ';
  btn.className = soundEnabled ? 'sound-mini-btn' : 'sound-mini-btn muted';
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  syncSoundButtonUI();
  if (soundEnabled) {
    ensureAudioContext();
    speakAmharicFallback('ድምፅ ተከፍቷል');
  }
}

function playCountdownTickTone() {
  if (!soundEnabled) return;
  const ctx = ensureAudioContext();
  if (!ctx) return;
  try {
    const start = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, start);
    gain.gain.setValueAtTime(0.001, start);
    gain.gain.linearRampToValueAtTime(0.28, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.16);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + 0.17);
  } catch (_) {}
}

function getBallFileName(n) {
  if(n <= 15) return `b${n}.mp3`;
  if(n <= 30) return `i${n}.mp3`;
  if(n <= 45) return `n${n}.mp3`;
  if(n <= 60) return `g${n}.mp3`;
  return `o${n}.mp3`;
}

function getAmharicSpeechText(n) {
  if(n <= 15) return 'ቢ ' + n;
  if(n <= 30) return 'አይ ' + n;
  if(n <= 45) return 'ኤን ' + n;
  if(n <= 60) return 'ጂ ' + n;
  return 'ኦ ' + n;
}

function speakAmharicFallback(text) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'am-ET';
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const amVoice = voices.find(v => (v.lang || '').toLowerCase().startsWith('am'));
      if (amVoice) utter.voice = amVoice;
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }
  } catch (_) {}
}

// ከአንድ ፎልደር ውስጥ በራሱ (.mp3) እንዲፈልግ እና እንዲያጫውት
function playFromFolderCandidates(candidates, index, speechText) {
  if (!soundEnabled) return;
  if (index >= candidates.length) {
    speakAmharicFallback(speechText);
    return;
  }

  const path = candidates[index];
  const snd = new Audio(path);
  snd.volume = 1.0;

  let handled = false;
  const tryNext = () => {
    if (handled) return;
    handled = true;
    playFromFolderCandidates(candidates, index + 1, speechText);
  };

  snd.onerror = tryNext;
  snd.play().catch(tryNext);
}

function playBallSound(ballNum) {
  if (!soundEnabled) return;
  const fileName = getBallFileName(ballNum);
  const candidates = [
    `./${fileName}`,
    fileName,
    `./audio/${fileName}`,
    `audio/${fileName}`
  ];
  playFromFolderCandidates(candidates, 0, getAmharicSpeechText(ballNum));
}

function playWinSound() {
  if (!soundEnabled) return;
  const candidates = [
    './bingo.mp3',
    'bingo.mp3',
    './audio/bingo.mp3',
    'audio/bingo.mp3'
  ];
  playFromFolderCandidates(candidates, 0, 'ቢንጎ አሸንፈዋል');
}

function normalizeUsername(raw, fallbackName='') {
  let clean = (raw || '').trim().replace(/^@+/, '');
  if (!clean && fallbackName) {
    clean = fallbackName.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
  }
  return '@' + (clean || 'tg_player');
}

function initBotRegisteredPlayer() {
  const params = new URLSearchParams(window.location.search);
  const urlUser = params.get('username') || params.get('tg_user') || '';
  const urlName = params.get('name') || params.get('first_name') || '';
  const urlId = params.get('tg_id') || params.get('user_id') || '';
  const urlBal = parseFloat(params.get('bal') || params.get('balance'));

  let tgUserObj = null;
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      tgUserObj = window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
    }
  } catch (_) {}

  const savedUser = localStorage.getItem('sodo_tg_username') || '';
  const savedName = localStorage.getItem('sodo_tg_name') || '';
  const savedId = localStorage.getItem('sodo_tg_id') || '';
  const savedBal = parseFloat(localStorage.getItem('sodo_user_bal'));

  if (tgUserObj && (tgUserObj.id || tgUserObj.username || tgUserObj.first_name)) {
    tgName = [tgUserObj.first_name, tgUserObj.last_name].filter(Boolean).join(' ') || 'Telegram User';
    tgUsername = normalizeUsername(tgUserObj.username, tgName);
    tgId = tgUserObj.id ? String(tgUserObj.id) : '';
  } else if (urlUser || urlName || urlId) {
    tgName = urlName || savedName || 'Telegram Player';
    tgUsername = normalizeUsername(urlUser || savedUser, tgName);
    tgId = urlId || savedId;
  } else if (savedUser) {
    tgName = savedName || 'Telegram Player';
    tgUsername = normalizeUsername(savedUser, tgName);
    tgId = savedId;
  } else {
    tgName = 'Bot Player';
    tgUsername = '@bot_player';
    tgId = '';
  }

  uid = tgId ? "tg_" + tgId : "tg_" + tgUsername;

  if (!isNaN(urlBal) && isFinite(urlBal) && urlBal >= 0) {
    balance = Math.round(urlBal * 100) / 100;
  } else if (!isNaN(savedBal) && isFinite(savedBal) && savedBal >= 0) {
    balance = Math.round(savedBal * 100) / 100;
  } else {
    balance = 50.00;
  }

  localStorage.setItem('sodo_tg_name', tgName);
  localStorage.setItem('sodo_tg_username', tgUsername);
  localStorage.setItem('sodo_tg_id', tgId);
  localStorage.setItem('sodo_user_bal', String(balance));

  $('#u-tg-user').textContent = tgUsername;
  $('#u-bal').textContent = balance.toFixed(2);
}

function getCardNumbers(cardId) {
  const r = R(cardId * 997);
  let colB = [], colI = [], colN = [], colG = [], colO = [];
  while(colB.length < 5) { let n = Math.floor(r() * 15) + 1; if(!colB.includes(n)) colB.push(n); }
  while(colI.length < 5) { let n = Math.floor(r() * 15) + 16; if(!colI.includes(n)) colI.push(n); }
  while(colN.length < 5) { let n = Math.floor(r() * 15) + 31; if(!colN.includes(n)) colN.push(n); }
  while(colG.length < 5) { let n = Math.floor(r() * 15) + 46; if(!colG.includes(n)) colG.push(n); }
  while(colO.length < 5) { let n = Math.floor(r() * 15) + 61; if(!colO.includes(n)) colO.push(n); }
  colN[2] = "FREE";
  let grid = [];
  for(let i=0; i<5; i++) { grid.push(colB[i], colI[i], colN[i], colG[i], colO[i]); }
  return grid;
}

function getBallLetter(n) {
  if(n <= 15) return 'B' + n;
  if(n <= 30) return 'I' + n;
  if(n <= 45) return 'N' + n;
  if(n <= 60) return 'G' + n;
  return 'O' + n;
}

function startCountdown() {
  isCountingDown = true;
  timeLeft = 30;
  $('#st-timer').textContent = timeLeft + 's';

  countdownInterval = setInterval(() => {
    timeLeft--;
    $('#st-timer').textContent = timeLeft + 's';
    if(timeLeft >= 1 && timeLeft <= 3) {
      playCountdownTickTone();
    }
    if(timeLeft <= 0) {
      clearInterval(countdownInterval);
      isCountingDown = false;
      $('#st-timer').textContent = '0s';
      beginAutoGame();
    }
  }, 1000);
}

        <div class="live-ball-box">
          <div class="live-ball-main">
            <div class="main-big-ball" id="live-big-ball">–</div>
          </div>
          <div class="recent-balls-row" id="live-recent-balls"></div>
          <button type="button" id="sound-toggle-btn" class="sound-mini-btn" onclick="toggleSound()">🔊</button>
        </div>
        <div class="scrollable-cards-container" id="live-scrollable-cards">
          ${cardsHtml}
        </div>
      </div>
    `;

    container.innerHTML = `<div class="main-layout">${mbHtml}${rightHtml}</div>`;
    gameLayoutInitialized = true;
    syncSoundButtonUI();
  }

  let latestBall = drawnBalls.length > 0 ? drawnBalls[drawnBalls.length - 1] : null;
  document.querySelectorAll('#live-master-board .mb-num').forEach(el => {
    let n = parseInt(el.dataset.mbNum, 10);
    if(n === latestBall) {
      el.className = 'mb-num latest-called-mark';
    } else if(drawnBalls.includes(n)) {
      el.className = 'mb-num called-num-mark';
    } else {
      el.className = 'mb-num';
    }
  });

  let lastBall = latestBall !== null ? getBallLetter(latestBall) : '–';
  let recentBalls = drawnBalls.slice(-4, -1).reverse().map(b => `<div class="recent-chip">${getBallLetter(b)}</div>`).join('');
  if($('#live-big-ball')) $('#live-big-ball').textContent = lastBall;
  if($('#live-recent-balls')) $('#live-recent-balls').innerHTML = recentBalls;

  selectedCards.forEach(cId => {
    let cardBox = document.querySelector(`#live-scrollable-cards [data-card-id="${cId}"]`);
    if(!cardBox) return;
    let nums = getCardNumbers(cId);
    let winningIndices = winningIndicesPerCard[cId] || [];

    nums.forEach((n, idx) => {
      let cellEl = cardBox.querySelector(`[data-cell-idx="${idx}"]`);
      if(!cellEl) return;
      let isMarked = n === "FREE" || drawnBalls.includes(n);
      let isWinLine = winningIndices.includes(idx);
      let isWinBall = isWinLine && n === winningBallNum;

      let cellClass = '';
      if(isWinBall) {
        cellClass = 'winning-ball-blink';
      } else if(isWinLine) {
        cellClass = 'winning-line-gold';
      } else if(isMarked) {
        cellClass = 'marked-cell';
      }
      cellEl.className = 'mini-cell ' + cellClass;
    });
  });
}

function beginAutoGame() {
  if(selectedCards.length === 0) return;
  ensureAudioContext();
  currentGameCode = generateGameCode();
  isGameRunning = true;
  isCountingDown = false;
  drawnBalls = [];
  winningIndicesPerCard = {};
  winningLineTypeDesc = {};
  winningBallNum = null;
  gameLayoutInitialized = false;
  updateUI();

  let allNums = [];
  for(let i=1; i<=75; i++) allNums.push(i);
  allNums.sort(() => Math.random() - 0.5);

  let ballIndex = 0;
  gameInterval = setInterval(() => {
    if(ballIndex >= allNums.length) {
      clearInterval(gameInterval);
      return;
    }
    let currentBall = allNums[ballIndex++];
    drawnBalls.push(currentBall);
    playBallSound(currentBall);
    updateUI();

    checkWinCondition();
  }, 2500);
}

function checkWinCondition() {
  let winningCards = [];
  winningIndicesPerCard = {};
  winningLineTypeDesc = {};

  selectedCards.forEach(cId => {
    let winData = getWinningLineData(cId);
    if(winData.idxs.length > 0) {
      winningIndicesPerCard[cId] = winData.idxs;
      winningLineTypeDesc[cId] = winData.desc;
      if(!winningCards.includes(cId)) winningCards.push(cId);
    }
  });

  if(winningCards.length > 0) {
    winningBallNum = drawnBalls[drawnBalls.length - 1];
    clearInterval(gameInterval);
    playWinSound();
    updateUI();
    handleWinners(winningCards);
  }
}

function getWinningLineData(cId) {
  let nums = getCardNumbers(cId);
  let isMarked = (val) => val === "FREE" || drawnBalls.includes(val);

  for(let r=0; r<5; r++) {
    let idxs = [r*5, r*5+1, r*5+2, r*5+3, r*5+4];
    if(idxs.every(i => isMarked(nums[i]))) return { idxs: idxs, desc: `አግድም መስመር (Row ${r+1})` };
  }
  for(let c=0; c<5; c++) {
    let idxs = [c, c+5, c+10, c+15, c+20];
    if(idxs.every(i => isMarked(nums[i]))) return { idxs: idxs, desc: `ቀጥታ መስመር (Column ${c+1})` };
  }
  let diag1 = [0, 6, 12, 18, 24];
  if(diag1.every(i => isMarked(nums[i]))) return { idxs: diag1, desc: 'ሰያፍ መስመር (Diagonal 1)' };

  let diag2 = [4, 8, 12, 16, 20];
  if(diag2.every(i => isMarked(nums[i]))) return { idxs: diag2, desc: 'ሰያፍ መስመር (Diagonal 2)' };

  let corners = [0, 4, 20, 24];
  if(corners.every(i => isMarked(nums[i]))) return { idxs: corners, desc: 'አራት ማዕዘኖች (Four Corners)' };

  return { idxs: [], desc: '' };
}

function handleWinners(winners) {
  let derashPool = getDerashAmount();
  let derashPerWinner = derashPool / winners.length;
  let bonusVal = Number(bonusAmount) || 0;
  let bonusPerWinner = bonusVal / winners.length;
  let totalPrizePerWinner = derashPerWinner + bonusPerWinner;
  let totalAwarded = totalPrizePerWinner * winners.length;

  let displayWinnerHandle = tgUsername || '@bot_player';
  winners.forEach(cId => {
    recordWinnerEntry(displayWinnerHandle, cId, totalPrizePerWinner, currentGameCode);
  });

  let winnerLinesHtml = winners.map(cId => {
    let bonusPart = bonusVal > 0 ? ` + ${bonusPerWinner.toFixed(2)} bonus` : '';
    return `<div style="margin-bottom:4px">ቢንጎ! ${displayWinnerHandle} (${cId}) won ${derashPerWinner.toFixed(2)} ብር${bonusPart}</div>`;
  }).join('');

  let infoHtml = `<div style="font-size:13px;font-weight:700;color:#4ade80;margin-bottom:10px">${winnerLinesHtml}</div>`;

  winners.forEach(cId => {
    let nums = getCardNumbers(cId);
    let winningIndices = winningIndicesPerCard[cId] || [];

    let bigCardHtml = `
      <div style="background:var(--bg);padding:8px;border-radius:10px;margin:6px 0">
        <div class="win-big-grid">
          <div class="win-big-header" style="color:#ef4444;background:rgba(239,68,68,0.12)">B</div>
          <div class="win-big-header" style="color:#eab308;background:rgba(234,179,8,0.12)">I</div>
          <div class="win-big-header" style="color:#22c55e;background:rgba(34,197,94,0.12)">N</div>
          <div class="win-big-header" style="color:#3b82f6;background:rgba(59,130,246,0.12)">G</div>
          <div class="win-big-header" style="color:#f97316;background:rgba(249,115,22,0.12)">O</div>
          ${nums.map((n, idx) => {
            let isWinLine = winningIndices.includes(idx);
            let isWinBall = isWinLine && n === winningBallNum;
            let isMarked = n === "FREE" || drawnBalls.includes(n);
            
            let cellStyle = '';
            if(isWinBall) {
              cellStyle = 'animation: winningBallOnlyBlink 0.7s infinite; border:1px solid #4ade80;';
            } else if(isWinLine) {
              cellStyle = 'background-color:#16a34a; color:#ffffff; border:1px solid #86efac;';
            } else if(isMarked) {
              cellStyle = 'background:rgba(34,197,94,0.45); color:#ffffff;';
            } else {
              cellStyle = 'background:rgba(51,65,85,0.45); color:var(--ink);';
            }
            let label = n === "FREE" ? "★" : n;
            return `<div class="win-big-cell" style="${cellStyle}">${label}</div>`;
          }).join('')}
        </div>
      </div>
    `;

    infoHtml += bigCardHtml;
  });

  $('#winner-info-box').innerHTML = infoHtml;
  $('#winner-modal').hidden = false;

  updateBalance(Number(balance) + Number(totalAwarded));

  setTimeout(() => {
    $('#winner-modal').hidden = true;
    resetGame();
  }, 6000);
}

function resetGame() {
  isGameRunning = false;
  isCountingDown = false;
  selectedCards = [];
  drawnBalls = [];
  winningIndicesPerCard = {};
  winningLineTypeDesc = {};
  winningBallNum = null;
  currentGameCode = "";
  gameLayoutInitialized = false;
  timeLeft = 30;
  $('#st-timer').textContent = timeLeft + 's';
  renderCardNumberGrid();
  updateUI();
}
</script></body></html>
